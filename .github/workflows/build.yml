name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        id: gradle_build
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          cat build.log

      - name: Push build log to git branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-log-branch
          cp build.log build_error.txt
          git add build_error.txt
          git commit -m "ci: upload build log" || true
          git push -f origin build-log-branch || true

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: steps.gradle_build.outcome == 'success'
        with:
          name: YouTubeDownloader-APKs
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: steps.gradle_build.outcome == 'success' && github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0"
          name: "YouTube Downloader v1.0.0 APK"
          body: "Standalone on-device YouTube video and audio downloader Android APK built with youtubedl-android and Jetpack Compose."
          files: app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false

      - name: Fail if build failed
        if: steps.gradle_build.outcome != 'success'
        run: exit 1
